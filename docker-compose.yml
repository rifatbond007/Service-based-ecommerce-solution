version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      - user-service
      - product-service
      - order-service
      - cart-service
      - payment-service
    networks:
      - ecommerce-network

  user-service:
    build: ./services/user-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
      - JWT_SECRET=your-secret-key
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce-network

  product-service:
    build: ./services/product-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
    depends_on:
      - postgres
      - redis
    networks:
      - ecommerce-network

  order-service:
    build: ./services/order-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - ecommerce-network

  cart-service:
    build: ./services/cart-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - ecommerce-network

  payment-service:
    build: ./services/payment-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network

  notification-service:
    build: ./services/notification-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network

  shipping-service:
    build: ./services/shipping-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network

  review-service:
    build: ./services/review-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=development
      - PORT=3008
      - DATABASE_URL=postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
    depends_on:
      - postgres
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  ecommerce-network:
    driver: bridge
